name: Production smoke checks

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Allow the production deployment to start
        run: sleep 90
      - name: Check published site, booking configuration, and form endpoints
        run: node tests/production-smoke.mjs
