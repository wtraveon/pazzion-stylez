name: Site smoke test

on:
  push:
    branches: [main, "fix/**", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check script.js && node --check booking-routes.js
      - name: Run site regression tests
        run: node --test tests/site-integrity.test.mjs
      - name: Validate site links, metadata, JSON-LD, and booking routes
        run: node scripts/site-smoke-test.mjs
